<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>示例 HTML 页面</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3ecdf; color: #181510; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 3rem; border: 1px solid #cfc2ae; background: rgba(255, 255, 255, 0.45); }
      h1 { margin-top: 0; }
      a { color: #9b2d22; }
    </style>
  </head>
  <body>
    <main>
      <h1>示例 HTML 页面</h1>
      <p>这是由独立 HTML 文件提供的页面。以后可以直接替换或增加文件。</p>
      <a href="/preview">返回观景启窗</a>
    </main>
  </body>
</html>
